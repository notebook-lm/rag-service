services:
  rag-service:
    image: notebook-lm/rag-service:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      embedding:
        condition: service_healthy
      embedding-init:
        condition: service_completed_successfully
    networks:
      - notebook-lm

  embedding:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "8050:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - embedding-data:/root/.ollama
    networks:
      - notebook-lm

  embedding-init:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      embedding:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: "OLLAMA_HOST=http://embedding:11434 ollama pull qwen3-embedding:0.6b"
    volumes:
      - embedding-data:/root/.ollama
    networks:
      - notebook-lm

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag_service
      POSTGRES_USER: rag_service
      POSTGRES_PASSWORD: rag_service
    ports:
      - "5411:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_service -d rag_service"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - notebook-lm

networks:
  notebook-lm:
    external: true

volumes:
  embedding-data:
  postgres-data:
