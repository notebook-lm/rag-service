services:
  rag-service:
    image: notebook-lm/rag-service:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      embedding:
        condition: service_healthy
    networks:
      - notebook-lm

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command:
      - --model-id
      - Qwen/Qwen3-Embedding-0.6B
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - embedding-data:/data
    networks:
      - notebook-lm

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag_service
      POSTGRES_USER: rag_service
      POSTGRES_PASSWORD: rag_service
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_service -d rag_service"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - notebook-lm

networks:
  notebook-lm:
    external: true

volumes:
  embedding-data:
  postgres-data:
